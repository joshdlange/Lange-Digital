<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" width="200" height="50" fill="none">
  <defs>
    <linearGradient id="oGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Main wordmark -->
  <text
    y="28"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-weight="700"
    font-size="28"
    letter-spacing="-0.5"
  >
    <tspan fill="white">Silly Br</tspan><tspan fill="url(#oGrad)">o</tspan><tspan fill="white">s</tspan>
  </text>

  <!-- Tagline underneath -->
  <text
    y="43"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-weight="400"
    font-size="10"
    letter-spacing="0.4"
    fill="url(#tagGrad)"
  >Serious revenue, silly name.</text>
</svg>
